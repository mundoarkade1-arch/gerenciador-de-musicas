<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src data:;">
<title>Gerenciador de Músicas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina">
  <header>
    <h1>🎵 Gerenciador de Músicas</h1>
    <p class="suave">Ele lê os nomes das suas músicas. Só envia arquivos para o seu Google Drive quando você clica em um botão de subir. Nunca apaga nada.</p>
  </header>

  <section class="cartao">
    <button id="botaoPasta">📁 Escolher pasta das músicas</button>
    <p id="mensagem" class="suave"></p>
    <div id="numeros" class="numeros"></div>
  </section>

  <nav class="abas">
    <button data-aba="repetidas" class="ativa">Repetidas</button>
    <button data-aba="top">Top 200</button>
    <button data-aba="novidades">Novidades</button>
  </nav>

  <main id="conteudo"></main>
</div>
<script src="data/charts.js"></script>
<script src="app.js"></script>
</body>
</html>
