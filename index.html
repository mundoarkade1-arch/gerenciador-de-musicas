<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src data:;">
<title>Gerenciador de Músicas</title>
<link rel="stylesheet" href="style.css?v=20261117">
</head>
<body>

<!-- FAIXA DE AVISO: aparece no topo, largura total, só quando há aviso (montada pelo ui.js) -->
<div id="faixa" class="faixa" aria-live="polite" hidden></div>

<div class="pagina">

  <!-- 1. TOPO -->
  <header class="topo">
    <div class="marca">
      <span class="logo" data-ico="musica"></span>
      <span class="marca-nome">Gerenciador de Músicas</span>
    </div>
    <div class="topo-dir">
      <span id="etqPasta" class="etq" hidden></span>
      <span id="etqGoogle" class="etq" hidden></span>
      <button id="botaoTema" class="redondo" type="button" aria-label="Trocar tema"></button>
    </div>
  </header>

  <!-- 2. CARTÃO PRINCIPAL: o que fazer agora -->
  <section id="hero" class="hero" data-passo="1" aria-label="O que fazer agora">
    <div class="hero-esq">
      <p id="heroEyebrow" class="eyebrow"></p>
      <h1 id="heroTitulo" class="titulo"></h1>
      <p id="heroTexto" class="hero-texto"></p>
      <div class="hero-acoes">
        <button id="botaoPrincipal" class="btn-v grande" type="button"></button>
        <button id="botaoAntes" class="btn-s grande" type="button" hidden></button>
        <button id="botaoGoogle" class="btn-s grande" type="button" hidden>Entrar com Google primeiro</button>
      </div>
      <p class="selo-linha"><span class="ico-verde" data-ico="escudo"></span><span id="heroSelo"></span></p>
    </div>
    <aside class="hero-dir" aria-label="O que vai acontecer">
      <h2 class="eyebrow">O que vai acontecer</h2>
      <ol id="plano" class="plano"></ol>
    </aside>
  </section>

  <!-- Resumo final de uma operação (fica até a próxima) -->
  <section id="resumo" class="resumo" aria-label="Resumo" hidden></section>

  <!-- 3. NÚMEROS -->
  <div id="numeros" class="numeros" hidden></div>

  <!-- 4. ABAS -->
  <nav class="abas" aria-label="Seções">
    <button type="button" data-aba="repetidas" aria-current="true">Repetidas</button>
    <button type="button" data-aba="top">Top 200</button>
    <button type="button" data-aba="novidades">Novidades</button>
    <button type="button" data-aba="drive">Google Drive</button>
  </nav>
  <p class="paraque"><span class="info-i" data-ico="info"></span><span id="paraque"></span></p>

  <!-- 5. CONTEÚDO DA ABA -->
  <main id="conteudo"></main>

  <footer class="rodape">
    <button id="botaoHistorico" class="link" type="button">Ver últimos avisos</button>
  </footer>
</div>

<noscript><p class="vazio">Este site precisa do JavaScript ligado no navegador.</p></noscript>
<script src="ui.js?v=20261117"></script>
<script src="data/charts.js?v=20261117"></script>
<script src="youtube.js?v=20261117"></script>
<script src="app.js?v=20261117"></script>
</body>
</html>
