<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client https://api.deezer.com; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src data:;">
<title>Gerenciador de Músicas</title>
<link rel="stylesheet" href="style.css?v=20261127a">
</head>
<body>

<!-- FAIXA DE AVISO: aparece no topo, só quando há aviso ou trabalho em andamento (montada pelo ui.js) -->
<div id="faixa" class="faixa" aria-live="polite" hidden></div>

<div class="pagina">

  <header class="topo">
    <div class="marca">
      <span class="logo" data-ico="musica"></span>
      <h1 class="marca-nome">Gerenciador de Músicas</h1>
    </div>
    <div class="topo-dir">
      <button id="botaoExtras" class="btn-s peq" type="button">Ferramentas extras</button>
      <button id="botaoTema" class="redondo" type="button" aria-label="Trocar tema"></button>
    </div>
  </header>

  <!-- TELA PRINCIPAL: só o que se usa todo dia -->
  <div id="telaPrincipal">

    <!-- 1. Google + botão grande -->
    <section id="painel" class="painel" aria-label="Painel principal">
      <div class="painel-topo">
        <span id="etqGoogle" class="pilula"></span>
        <span id="etqDrive" class="painel-info"></span>
      </div>
      <button id="botaoPrincipal" class="btn-p grande" type="button"></button>
      <p id="painelDica" class="painel-dica"></p>
      <div id="pcLinha" class="pc-linha">
        <span id="pcTexto" class="pc-texto"></span>
        <button id="botaoAntes" class="btn-s peq" type="button" hidden></button>
        <button id="botaoPasta" class="btn-s peq" type="button"></button>
      </div>
    </section>

    <!-- Resumo final de uma operação (fica até a próxima) -->
    <section id="resumo" class="resumo" aria-label="Resumo" hidden></section>

    <!-- 2. Minhas playlists + Deezer (montado pelo app.js) -->
    <section id="playlists" class="playlists" aria-label="Minhas playlists"></section>
  </div>

  <!-- PÁGINA "FERRAMENTAS EXTRAS": coisas raras, fora da tela principal -->
  <div id="telaExtras" hidden>
    <div class="extras-topo">
      <button id="botaoVoltar" class="btn-s" type="button">← Voltar para as playlists</button>
    </div>
    <h2 class="extras-titulo">Ferramentas extras</h2>
    <p class="nota">Coisas que você usa raramente. Nada aqui é preciso para o dia a dia.</p>
    <nav id="extrasMenu" class="extras-menu" aria-label="Ferramentas extras"></nav>
    <section id="extrasCorpo" class="extras-corpo" hidden>
      <div class="extras-corpo-topo">
        <button id="botaoVoltarMenu" class="btn-s peq" type="button">← Voltar às ferramentas</button>
        <h3 id="extrasNome" class="extras-nome"></h3>
      </div>
      <p id="extrasPara" class="nota"></p>
      <main id="conteudo"></main>
    </section>
  </div>
</div>

<noscript><p class="vazio">Este site precisa do JavaScript ligado no navegador.</p></noscript>
<script src="ui.js?v=20261127a"></script>
<script src="data/charts.js?v=20261118d"></script>
<script src="youtube.js?v=20261118d"></script>
<script src="app.js?v=20261127a"></script>
</body>
</html>
